[workspace]
resolver = "2"
members = ["shared", "emu", "proxy", "cubebox"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
authors = ["Alex Beng <pc98@qq.com>"]
license = "MIT"
repository = "https://github.com/Alex-Beng/GAN"

[workspace.dependencies]
log = "0.4"
anyhow = "1"
serde_json = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-futures = "0.1"
esp32-nimble = "0.12"
embuild = "0.33"
shared = { path = "shared" }

# Drawing primitives for the cubebox firmware (pure Rust, no C bindings).
embedded-graphics = "0.8"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
