[workspace]
resolver = "2"
members = ["shared", "emu", "proxy"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
authors = ["Alex Beng <pc98@qq.com>"]

[workspace.dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp32-nimble = "0.12"
embuild = "0.33"
shared = { path = "shared" }

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
