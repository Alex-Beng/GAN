[package]
name = "cubebox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gan-cubebox"
path = "src/main.rs"
harness = false

[features]
default = ["ble"]
# BLE Central (real cube input). Disable for UI/layout work on boards without a
# BLE build, or to build with a NimBLE-less ESP-IDF config:
#   cargo check -p cubebox --no-default-features
ble = ["dep:esp32-nimble", "dep:embassy-time", "dep:embassy-futures"]

[dependencies]
log.workspace = true
anyhow.workspace = true
serde_json.workspace = true
esp-idf-svc = { workspace = true, features = ["alloc"] }
embassy-time = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
esp32-nimble = { workspace = true, optional = true }
embedded-graphics.workspace = true
shared.workspace = true

[build-dependencies]
embuild.workspace = true

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["cubebox/sdkconfig.defaults", "cubebox/sdkconfig.s3.defaults"]

# LittleFS lives in its own data partition (`storage` in partitions.csv) so the
# record queue is not squeezed into the 24 KB default NVS partition.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "1.14" }


