<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Control</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='5' y='5' width='27' height='27' rx='4' fill='%23fff'/%3E%3Crect x='37' y='5' width='27' height='27' rx='4' fill='%23e00'/%3E%3Crect x='69' y='5' width='27' height='27' rx='4' fill='%230a0'/%3E%3Crect x='5' y='37' width='27' height='27' rx='4' fill='%23e80'/%3E%3Crect x='37' y='37' width='27' height='27' rx='4' fill='%23ff0'/%3E%3Crect x='69' y='37' width='27' height='27' rx='4' fill='%2300c'/%3E%3Crect x='5' y='69' width='27' height='27' rx='4' fill='%23e00'/%3E%3Crect x='37' y='69' width='27' height='27' rx='4' fill='%230a0'/%3E%3Crect x='69' y='69' width='27' height='27' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 12px; }
h2 { color: #333; margin-bottom: 4px; }
h3 { color: #555; margin: 8px 0 4px; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 20px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.row { display: flex; align-items: center; gap: 10px; }
.label { width: 32px; font-size: 18px; font-weight: bold; color: #555; text-align: center; }
button { height: 44px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: opacity 0.1s; }
button:active { opacity: 0.7; }
.cw  { background: #4caf50; color: #fff; width: 72px; }
.ccw { background: #f44336; color: #fff; width: 72px; }
.section { background: #fff; border-radius: 12px; padding: 16px; width: 100%; max-width: 400px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
input { width: 100%; height: 40px; border: 1px solid #ccc; border-radius: 8px; padding: 0 12px; font-size: 15px; margin-bottom: 8px; }
.btn { width: 100%; background: #2196f3; color: #fff; }
.btn:disabled { background: #aaa; cursor: not-allowed; }
.seq { font-size: 14px; color: #666; margin-bottom: 8px; word-break: break-all; }
.cube-net { display: inline-block; }
.net-row { display: flex; }
.net-spacer { width: 78px; height: 78px; }
.net-face { display: grid; grid-template-columns: repeat(3,26px); grid-template-rows: repeat(3,26px); gap: 0; border: 1px solid #999; }
.cell { width: 26px; height: 26px; border: 1px solid rgba(0,0,0,0.15); }
.color-U { background: #fff; } .color-R { background: #c41e3a; } .color-F { background: #009e60; }
.color-D { background: #ffd500; } .color-L { background: #ff5800; } .color-B { background: #0051ba; }
.temp-badge { display: inline-block; background: #607d8b; color: #fff; padding: 2px 12px; border-radius: 10px; font-size: 13px; margin-left: 8px; }
.temp-chart { width: 100%; max-width: 380px; height: 60px; border-radius: 8px; }
</style>
</head>
<body>
<h2>魔方控制<span id="tempBadge" class="temp-badge">--°C</span><span id="freqBadge" class="temp-badge">--MHz</span>
<select id="protoSelect" onchange="switchProto()" style="height:28px;border-radius:6px;border:1px solid #ccc;font-size:13px;margin-left:8px">
<option value="0">Gen2</option><option value="1">Gen3</option><option value="2">Gen4</option><option value="3">Gan251</option><option value="4">MoYu32</option><option value="5">QiYi</option>
</select></h2>
<svg id="tempChart" class="temp-chart" viewBox="0 0 380 60" style="display:none"><polyline id="tempLine" fill="none" stroke="#2196f3" stroke-width="2"/><text id="tempLabel" x="2" y="12" font-size="9" fill="#999">--°C</text></svg>
<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:12px;color:#999">刷新间隔</span><select id="tempInterval" onchange="changeTempInterval()" style="height:28px;border-radius:6px;border:1px solid #ccc;font-size:13px"><option value="5">5s</option><option value="10" selected>10s</option><option value="30">30s</option><option value="60">60s</option></select></div>
<div id="toast" class="toast"></div>

<div class="section">
<h3>单步转动</h3>
<div class="row"><span class="label">U</span><button class="cw"  onclick="move(0,0)">U</button><button class="ccw" onclick="move(0,1)">U'</button></div>
<div class="row"><span class="label">R</span><button class="cw"  onclick="move(1,0)">R</button><button class="ccw" onclick="move(1,1)">R'</button></div>
<div class="row"><span class="label">F</span><button class="cw"  onclick="move(2,0)">F</button><button class="ccw" onclick="move(2,1)">F'</button></div>
<div class="row"><span class="label">D</span><button class="cw"  onclick="move(3,0)">D</button><button class="ccw" onclick="move(3,1)">D'</button></div>
<div class="row"><span class="label">L</span><button class="cw"  onclick="move(4,0)">L</button><button class="ccw" onclick="move(4,1)">L'</button></div>
<div class="row"><span class="label">B</span><button class="cw"  onclick="move(5,0)">B</button><button class="ccw" onclick="move(5,1)">B'</button></div>
</div>

<div class="section">
<h3>魔方状态</h3>
<div class="cube-net">
  <div class="net-row"><div class="net-spacer"></div><div class="net-face" id="faceU"></div><div class="net-spacer"></div><div class="net-spacer"></div><div class="net-spacer"></div></div>
  <div class="net-row"><div class="net-face" id="faceL"></div><div class="net-face" id="faceF"></div><div class="net-face" id="faceR"></div><div class="net-face" id="faceB"></div></div>
  <div class="net-row"><div class="net-spacer"></div><div class="net-face" id="faceD"></div><div class="net-spacer"></div><div class="net-spacer"></div><div class="net-spacer"></div></div>
</div>
<div style="text-align:center;margin-top:6px;display:flex;gap:8px;justify-content:center">
  <button class="btn" style="width:auto;padding:0 16px" onclick="fetchFacelets()">刷新状态</button>
  <button class="btn" style="width:auto;padding:0 16px;background:#e91e63" onclick="resetCube()">重置魔方</button>
</div>
</div>

<div class="section">
<h3>打乱公式</h3>
<input id="scrambleInput" placeholder="输入打乱公式如 R U R' F' D2 L' B" oninput="parseScramble()">
<div class="seq" id="scrambleDisplay">打乱序列: (空)</div>
<div style="display:flex;gap:8px">
<button class="btn" id="scrambleBtn" onclick="execScramble()" disabled style="flex:1">执行打乱</button>
<button class="btn" onclick="genRandomScramble()" style="flex:1;background:#9c27b0">随机打乱</button>
</div>
</div>

<div class="section">
<h3>批量转动</h3>
<div class="seq" id="seqDisplay">当前序列: (空)</div>
<input id="seqInput" placeholder="输入序列如 R U R' U'" oninput="parseSeq()">
<div style="display:flex;gap:8px">
<button class="btn" id="seqBtn" onclick="execSeq()" disabled style="flex:1">执行序列</button>
<button class="btn" onclick="clearMoves()" style="flex:1;background:#e91e63">清除队列</button>
</div>
</div>

<div class="section">
<h3>WiFi 模式</h3>
<div id="wifiStatus" style="font-size:13px;color:#666;margin-bottom:8px">加载中...</div>
<input id="wifiSsid" placeholder="WiFi 名称 (SSID)" oninput="enableWifiBtn()">
<input id="wifiPass" type="password" placeholder="WiFi 密码" oninput="enableWifiBtn()">
<button class="btn" id="wifiStaBtn" onclick="switchWifi(false)" disabled>连接局域网</button>
<button class="btn" style="background:#ff9800;margin-top:4px" onclick="switchWifi(true)">切回热点模式</button>
<button class="btn" style="background:#e91e63;margin-top:4px" onclick="disableAP()">关闭 AP (降功耗)</button>
</div>

<div class="section">
<h3>转动延迟</h3>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
  <input type="range" id="delaySlider" min="0" max="500" step="10" value="50" style="flex:1;height:40px" oninput="delaySliderChange()">
  <input type="number" id="delayInput" min="0" max="500" value="50" style="width:80px;margin-bottom:0" oninput="delayInputChange()">
  <span style="color:#666;font-size:14px">ms</span>
</div>
<button class="btn" onclick="setDelay()">保存延迟</button>
</div>

<script>
const FACE_ORDER = ['U','R','F','D','L','B'];
function renderFace(elId, faceletStr) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const c = faceletStr[i];
    const d = document.createElement('div');
    d.className = 'cell color-' + c;
    el.appendChild(d);
  }
}
function fetchFacelets() {
  fetch('/api/facelets').then(r => r.text()).then(s => {
    for (let i = 0; i < 6; i++) {
      renderFace('face' + FACE_ORDER[i], s.slice(i*9, i*9+9));
    }
  }).catch(() => toast('获取状态失败'));
}
fetchFacelets();

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}
function move(face, dir) {
  fetch('/api/move', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({face, dir})
  }).then(r => r.text()).then(t => { toast(t); fetchFacelets(); }).catch(() => toast('错误'));
}

let scrambleMoves = [];

function parseScramble() {
  const input = document.getElementById('scrambleInput').value.trim();
  const display = document.getElementById('scrambleDisplay');
  const btn = document.getElementById('scrambleBtn');
  scrambleMoves = [];
  if (!input) { display.textContent = '打乱序列: (空)'; btn.disabled = true; return; }
  const tokens = input.split(/\s+/);
  for (const t of tokens) {
    const m = t.match(/^([URFDLB])(['2]?)$/);
    if (!m) { display.textContent = '解析错误: ' + t; btn.disabled = true; return; }
    const face = FACE_MAP[m[1]];
    const dir = m[2] === "'" ? 1 : 0;
    scrambleMoves.push({face, dir});
    if (m[2] === '2') scrambleMoves.push({face, dir: 0});
  }
  display.textContent = '打乱序列: ' + scrambleMoves.map(m => {
    const names = ['U','R','F','D','L','B'];
    return names[m.face] + (m.dir ? "'" : '');
  }).join(' ');
  btn.disabled = scrambleMoves.length === 0;
}

function execScramble() {
  if (scrambleMoves.length === 0) return;
  fetch('/api/moves', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(scrambleMoves)
  }).then(r => r.text()).then(t => { toast(t); document.getElementById('scrambleInput').value = ''; parseScramble(); fetchFacelets(); }).catch(() => toast('错误'));
}

function genRandomScramble() {
  const faces = ['U','R','F','D','L','B'];
  const mods = ['', "'", '2'];
  let seq = [];
  let last = -1, secondLast = -1;
  for (let i = 0; i < 20; i++) {
    let f;
    do { f = Math.floor(Math.random() * 6); } while (f === last || (f === secondLast && Math.floor(f/2) === Math.floor(last/2)));
    const m = mods[Math.floor(Math.random() * 3)];
    seq.push(faces[f] + m);
    secondLast = last;
    last = f;
  }
  document.getElementById('scrambleInput').value = seq.join(' ');
  parseScramble();
}

const FACE_MAP = {U:0,R:1,F:2,D:3,L:4,B:5};
let parsedMoves = [];

function parseSeq() {
  const input = document.getElementById('seqInput').value.trim();
  const display = document.getElementById('seqDisplay');
  const btn = document.getElementById('seqBtn');
  parsedMoves = [];
  if (!input) { display.textContent = '当前序列: (空)'; btn.disabled = true; return; }
  const tokens = input.split(/\s+/);
  for (const t of tokens) {
    const m = t.match(/^([URFDLB])(['2]?)$/);
    if (!m) { display.textContent = '解析错误: ' + t; btn.disabled = true; return; }
    const face = FACE_MAP[m[1]];
    const dir = m[2] === "'" ? 1 : 0;
    parsedMoves.push({face, dir});
    if (m[2] === '2') parsedMoves.push({face, dir: 0});
  }
  display.textContent = '当前序列: ' + parsedMoves.map(m => {
    const names = ['U','R','F','D','L','B'];
    return names[m.face] + (m.dir ? "'" : '');
  }).join(' ');
  btn.disabled = parsedMoves.length === 0;
}

function execSeq() {
  if (parsedMoves.length === 0) return;
  fetch('/api/moves', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(parsedMoves)
  }).then(r => r.text()).then(t => { toast(t); document.getElementById('seqInput').value = ''; parseSeq(); fetchFacelets(); }).catch(() => toast('错误'));
}

function clearMoves() {
  fetch('/api/moves/clear', {method:'POST'})
    .then(r => r.json()).then(j => toast('已清除 ' + j.cleared + ' 个指令'))
    .catch(() => toast('清除失败'));
}

function resetCube() {
  fetch('/api/reset', {method:'POST'})
    .then(r => r.text()).then(t => { toast(t); fetchFacelets(); })
    .catch(() => toast('错误'));
}

function switchWifi(isAp) {
  const ssid = document.getElementById('wifiSsid').value;
  const pass = document.getElementById('wifiPass').value;
  const body = isAp ? {ap:1,sta:0,ssid:'',pass:''} : {ap:0,sta:1,ssid,pass};
  fetch('/api/wifi/mode', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(r => r.text()).then(t => { toast(t); fetchWifiStatus(); }).catch(() => toast('错误'));
}

function fetchWifiStatus() {
  fetch('/api/wifi/status').then(r => r.json()).then(d => {
    const el = document.getElementById('wifiStatus');
    const modeMap = {ap:'热点模式',sta:'局域网模式',mixed:'混合模式',unknown:'未知'};
    let text = '模式: ' + (modeMap[d.mode]||d.mode);
    text += ' | AP: ' + (d.ap_active ? '✅' : '❌');
    text += ' | STA: ' + (d.sta_connected ? '✅ 已连接' : '❌ 未连接');
    if (d.ip) text += ' (' + d.ip + ')';
    el.textContent = text;
  }).catch(() => {
    document.getElementById('wifiStatus').textContent = '获取状态失败';
  });
}
fetchWifiStatus();
setInterval(fetchWifiStatus, 5000);

function disableAP() {
  fetch('/api/wifi/ap/off', {method:'POST'})
    .then(r => r.text()).then(t => { toast(t); fetchWifiStatus(); })
    .catch(() => toast('关闭 AP 失败'));
}

function enableWifiBtn() {
  const ssid = document.getElementById('wifiSsid').value.trim();
  document.getElementById('wifiStaBtn').disabled = ssid.length === 0;
}

function delaySliderChange() {
  document.getElementById('delayInput').value = document.getElementById('delaySlider').value;
}
function delayInputChange() {
  document.getElementById('delaySlider').value = document.getElementById('delayInput').value;
}
function setDelay() {
  const d = document.getElementById('delayInput').value;
  fetch('/api/delay', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({delay:parseInt(d)})})
    .then(r=>r.text()).then(t=>toast('延迟: '+t)).catch(()=>toast('设置失败'));
}
fetch('/api/delay').then(r=>r.json()).then(j=>{
  document.getElementById('delaySlider').value=j.delay;
  document.getElementById('delayInput').value=j.delay;
});

let tempTimer = null;
let tempHistory = [];
const TEMP_MAX_POINTS = 120;
function getTempInterval() { return parseInt(document.getElementById('tempInterval').value) * 1000; }
function fetchTemp() {
  fetch('/api/temp').then(r => r.json()).then(j => {
    const el = document.getElementById('tempBadge');
    if (j.celsius != null) {
      const c = j.celsius.toFixed(1);
      const color = c < 30 ? '#4caf50' : c < 45 ? '#ff9800' : '#f44336';
      el.textContent = c + '°C';
      el.style.background = color;
      tempHistory.push(j.celsius);
      if (tempHistory.length > TEMP_MAX_POINTS) tempHistory.shift();
      drawTempChart();
    } else {
      el.textContent = '--°C';
      el.style.background = '#607d8b';
    }
  }).catch(() => {
    document.getElementById('tempBadge').textContent = '--°C';
  });
  fetch('/api/freq').then(r => r.json()).then(j => {
    const el = document.getElementById('freqBadge');
    el.textContent = j.mhz + 'MHz';
    el.style.background = j.mhz >= 160 ? '#e91e63' : j.mhz >= 80 ? '#ff9800' : '#4caf50';
  }).catch(() => {
    document.getElementById('freqBadge').textContent = '--MHz';
  });
}
function changeTempInterval() {
  stopTempPoll();
  startTempPoll();
}
function startTempPoll() {
  fetchTemp();
  if (tempTimer) clearInterval(tempTimer);
  tempTimer = setInterval(fetchTemp, getTempInterval());
}
function drawTempChart() {
  const svg = document.getElementById('tempChart');
  if (tempHistory.length < 2) { svg.style.display = 'none'; return; }
  svg.style.display = '';
  const poly = document.getElementById('tempLine');
  const w = 380, h = 50, padY = 8, padX = 0;
  const minT = Math.min(...tempHistory), maxT = Math.max(...tempHistory);
  const range = Math.max(maxT - minT, 1);
  const n = tempHistory.length;
  const xStep = (w - padX * 2) / (n - 1);
  let points = '';
  for (let i = 0; i < n; i++) {
    const x = padX + i * xStep;
    const y = padY + h - 1 - ((tempHistory[i] - minT) / range) * (h - padY * 2);
    points += (i ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
  }
  poly.setAttribute('points', points);
  const label = document.getElementById('tempLabel');
  label.textContent = maxT.toFixed(1) + '°C / ';
  label.textContent += minT.toFixed(1) + '°C';
}
function stopTempPoll() {
  if (tempTimer) { clearInterval(tempTimer); tempTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  document.hidden ? stopTempPoll() : startTempPoll();
});
startTempPoll();

function switchProto() {
  const idx = document.getElementById('protoSelect').value;
  fetch('/api/protocol', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:parseInt(idx)})})
    .then(r => r.json()).then(j => {
      if (j.protocol) toast('切换至 ' + j.protocol + ', 即将重启...');
      setTimeout(() => location.reload(), 3000);
    }).catch(() => toast('切换失败'));
}
fetch('/api/protocol').then(r => r.json()).then(j => {
  document.getElementById('protoSelect').value = j.index;
});
</script>
</body>
</html>
